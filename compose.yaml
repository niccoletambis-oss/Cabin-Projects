services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cabin
      POSTGRES_PASSWORD: cabin_dev
      POSTGRES_DB: cabin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cabin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabin -d cabin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cabin_data:
